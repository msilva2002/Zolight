<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- yellow highlight behind the letter -->
  <rect x="4" y="8" width="28" height="32" rx="3" fill="#f5c542"/>
  <!-- the letter Z -->
  <path d="M10 14 H26 L10 34 H26" fill="none" stroke="#2a2a35" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- marker pen, tip resting at the end of the highlight -->
  <g transform="translate(32 31) rotate(30) scale(0.72)">
    <path d="M-3 0 H3 L5.5 -7 H-5.5 Z" fill="#3a3a46"/>
    <rect x="-5.5" y="-27" width="11" height="20" rx="2" fill="#e8745a"/>
    <rect x="-6" y="-34" width="12" height="7" rx="2" fill="#2a2a35"/>
  </g>
</svg>
