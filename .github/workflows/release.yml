name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          V=$(python3 -c "import json;print(json.load(open('src/manifest.json'))['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$V"
            exit 1
          fi

      - name: Build
        run: python3 scripts/build.py --repo "$GITHUB_REPOSITORY"

      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.xpi --title "$GITHUB_REF_NAME" --generate-notes
          # Fixed "release" tag holds update.json so the update_url never changes
          gh release view release >/dev/null 2>&1 || \
            gh release create release --title "Update manifest" --notes "Maintained automatically by CI. Do not delete." --latest=false
          gh release upload release dist/update.json --clobber
